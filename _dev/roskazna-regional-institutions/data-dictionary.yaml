  kfo:
    '2': собственные доходы учреждения
    '4': субсидия на выполнение государственного (муниципального) задания
    '5': субсидии на иные цели
    '6': субсидии на цели осуществления капитальных вложений
    '7': средства по обязательному медицинскому страхованию
  activity_groups:
    target_funds: деятельность с целевыми средствами
    state_assignment: деятельность по государственному заданию
    own_income: приносящая доход деятельность
    total: итого
  reference_limits: Region names are transcribed from portal files; 00 has an empty name in 2026 headers. Activity groups
    0503721/0503730 cannot be treated as individual KFOs. 2014 header field labelled ОКПО contains 01/.../9500 and is preserved
    separately, not promoted to an organization ОКПО.
tidy_schema:
  grain: source physical form row × measure × KFO/activity/value_period; alternative representations must be filtered before
    aggregation
  fields:
  - name: report_date
    type: date
    description: ISO date of reporting snapshot, not publication date.
  - name: form_code
    type: string
    description: 0503737 / 0503721 / 0503730.
  - name: kfo
    type: string|null
    description: 2/4/5/6/7 only where individually identified; null for shared plan, matrix total and activity groups.
  - name: region_code
    type: string
    description: Two-digit code; legacy_2014_header_code is a separate code system.
  - name: region_name
    type: string|null
    description: From dated matrix header or historical founder text; null for 00 when header is empty.
  - name: region_code_raw
    type: string|null
    description: Before unique-ОКПО resolution.
  - name: region_code_system
    type: string
    description: Do not silently merge code systems.
  - name: region_resolution
    type: string
    description: source / unique_okpo_same_date / unresolved.
  - name: institution_name
    type: string|null
    description: Report compiler, not an individual institution.
  - name: okpo
    type: string|null
    description: Leading zeroes retained, eight digits when organization ID observed.
  - name: oktmo
    type: string|null
    description: Observed territorial code; retain 8/11 digits.
  - name: section
    type: string
    description: '0503737: 1–4; balance: named Roman section/off_balance; financial_results for 0503721.'
  - name: line_code
    type: string|null
    description: Three digits; null on some genuine rows. No blanket forward-fill.
  - name: analytics_code
    type: string|null
    description: Three-character numeric/alphanumeric analytic identifier.
  - name: line_code_raw
    type: string|number
    description: Unmodified source code.
  - name: analytics_code_raw
    type: string|number
    description: Retains standalone х/x separately from normalized null.
  - name: indicator_name
    type: string
    description: Source label with whitespace normalized.
  - name: is_total
    type: boolean
    description: Heuristic derived from printed label/marker; does not authorize automatic aggregation.
  - name: total_marker
    type: string|null
    description: Standalone Latin x or Cyrillic х.
  - name: off_balance_account_raw
    type: string|number|null
    description: Physical account cell.
  - name: parent_off_balance_account
    type: string|null
    description: Last explicit off-balance account on the sheet, contextual only.
  - name: representation
    type: string
    description: file_types.id; sum a single chosen representation.
  - name: activity_group
    type: string|null
    description: target_funds/state_assignment/own_income/total for 721/730.
  - name: value_period
    type: string
    description: reporting / opening / closing; stocks must not be summed over time.
  - name: measure
    type: string
    description: Measure name from physical column map; matrix KFO values normalize to executed_total_rub.
  - name: amount_rub
    type: decimal(20,2)|null
    description: CSV stores exact decimal text; null remains empty and explicit zero remains 0.00.
  - name: cell_state
    type: string
    description: value / blank_or_not_applicable; source does not establish that every blank is zero.
  - name: layout_id
    type: string
    description: Observed physical layout variant.
  - name: legacy_header_code
    type: string|null
    description: Raw 2014 code labelled ОКПО, kept without invented organization semantics.
  - name: source_member
    type: string
    description: Full archive chain separated by !.
  - name: sheet
    type: string
    description: Exact source sheet.
  - name: source_row
    type: integer
    description: One-based Excel row.
  - name: source_col
    type: string
    description: Excel column letter.
  unique_physical_key:
  - source_member
  - sheet
  - source_row
  - source_col
  economic_key_warning: report_date+form_code+region_code+kfo+section+line_code+analytics_code is not universally unique;
    preserve source coordinates and activity/period.
